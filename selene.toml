std = "wow"
exclude = [
    # Upstream/vendor libraries retain their own policy.
    "Libs/LibStub/**",
    "Libs/LibDBIcon-1.0/**",
    # Current maintained-library pins are temporarily deferred; see AGENTS.md.
    # After adopting linted releases, run Selene from each library's root.
    # These exclusions then only separate library globals from the addon config.
    "Libs/LibModernSettings-1.0/**",
    "Libs/LibSimpleDB/**",
    "Libs/LibChangelog-1.0/**",
    "Changelog/ReleaseNotes.lua",
]

[lints]
global_usage = "allow"
multiple_statements = "deny"

[config]
multiple_statements = { one_line_if = "allow" }
shadowing = { ignore_pattern = "^(self$|_)" }
